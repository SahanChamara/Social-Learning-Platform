<!DOCTYPE html>
<html lang="en">
<head>
    <title>GraphiQL</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
        body {
            height: 100%;
            margin: 0;
            width: 100%;
            overflow: hidden;
        }

        #graphiql {
            height: 100vh;
        }
    </style>
    <link rel="stylesheet" href="https://esm.sh/graphiql@5.2.4/style.css" />
</head>
<body>
<div id="graphiql">Loading...</div>
<script type="module">
    import React from "https://esm.sh/react@19.2.7?bundle";
    import { createRoot } from "https://esm.sh/react-dom@19.2.7/client?bundle";
    import { GraphiQL } from "https://esm.sh/graphiql@5.2.4?bundle";
    import { createGraphiQLFetcher } from "https://esm.sh/@graphiql/toolkit@0.12.1?bundle";
    import "https://esm.sh/graphiql@5.2.4/setup-workers/esm.sh";

    const params = new URLSearchParams(window.location.search);
    const path = params.get("path") || "/graphql";
    const url = `${location.protocol}//${location.host}${path}`;
    const wsPath = params.get("wsPath") || "/graphql-ws";
    const wsProtocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
    const subscriptionUrl = `${wsProtocol}//${location.host}${wsPath}`;
    const gqlFetcher = createGraphiQLFetcher({ url, subscriptionUrl });

    const root = createRoot(document.getElementById('graphiql'));
    root.render(
        React.createElement(GraphiQL, {
            fetcher: gqlFetcher,
            defaultVariableEditorOpen: true,
            headerEditorEnabled: true,
            shouldPersistHeaders: true
        })
    );
</script>
</body>
</html>
